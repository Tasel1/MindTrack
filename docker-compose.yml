services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mindtrack_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mindtrack_dev
      JWT_SECRET: very_long_random_secret_key_for_jwt_tokens
      JWT_REFRESH_SECRET: another_long_random_secret_for_refresh_tokens
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: http://localhost:3000
      SESSION_TIMEOUT_MINUTES: 30
      BACKUP_RETENTION_DAYS: 30
    ports:
      - "5002:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: >
      sh -c "npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:5002/api/v1
      VITE_APP_TITLE: MindTrack
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      sh -c "npm install && npm run dev"

volumes:
  postgres_data: